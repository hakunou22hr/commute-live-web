name: Check PWA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json > /dev/null
      - name: Verify required PWA files
        run: test -f index.html && test -f styles.css && test -f sw.js && test -f manifest.json
